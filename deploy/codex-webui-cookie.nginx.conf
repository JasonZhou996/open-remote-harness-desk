# Include inside the Codex HTTPS virtual host. Keep the existing Basic gate
# and LAN discovery cache; a valid backend cookie also admits location /.
location ~ ^/(manifest[.]json|assets/codex-lan-icon[.]png)$ {
    auth_basic off;
    proxy_pass http://127.0.0.1:18899;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Authorization "";
}

location = /__codex_session_check {
    internal;
    auth_basic off;
    proxy_pass http://127.0.0.1:18899/api/config;
    proxy_method GET;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Authorization "";
}

# In location /, replace inherited Basic-only checking with:
# satisfy any;
# auth_request /__codex_session_check;
# /api/auth/status issues the signed cookie after a successful gateway login.
